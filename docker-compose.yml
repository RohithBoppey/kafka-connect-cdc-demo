version: "1.0"
name: kafka-connect-demo

services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode - no ZooKeeper)
  # A single node acting as both broker and controller.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092" # for clients running on your host machine (localhost:9092)
    environment:
      # --- KRaft identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # any base64 UUID; fixed so restarts reuse the same cluster

      # --- Listeners ---
      # INTERNAL   -> used by other containers (e.g. Kafka Connect later): kafka:29092
      # EXTERNAL   -> used from your laptop: localhost:9092
      # CONTROLLER -> KRaft controller quorum traffic
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Single-node friendly defaults ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # --- Storage ---
      # the image defaults to /tmp/kafka-logs (inside the container, lost on rm); point it at the volume
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    # use the custom network
    networks: 
      - kafka_connect_demo

  # ---------------------------------------------------------------------------
  # MySQL 8 - binlog enabled in ROW format so Debezium can read changes later
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kafka_connect_demo

volumes:
  kafka-data:
    name: kafka-connect-demo-kafka-data # fixed name, so a project rename can't orphan it
  mysql-data:
    name: kafka-connect-demo-mysql # fixed name, so a project rename can't orphan it

# creating my own custom network for all the pods to conncet
networks: 
  kafka_connect_demo: 
    driver: bridge
    name: "kafka_connect_demo"