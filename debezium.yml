# Run this via: 
# docker compose -f debezium.yml down && docker compose -f debezium.yml up -d


# Kafka Connect (with Debezium connectors pre-installed), run as its OWN compose project.
# It joins the network created by docker-compose.yml, so it can reach kafka + mysql by name.
#
#   docker compose -f debezium.yml up -d     # start only Connect
#   docker compose -f debezium.yml down      # stop only Connect (kafka/mysql keep running)
#
# Requires docker-compose.yml to be up first (it creates the network).
name: kafka-connect-demo-debezium

services:
  connect:
    image: quay.io/debezium/connect:3.2.0.Final
    container_name: connect
    hostname: connect
    ports:
      - "8083:8083" # Kafka Connect REST API -> http://localhost:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:29092 # the INTERNAL listener
      GROUP_ID: my-connect-group     # workers with the same group id form one Connect cluster - i.e. different kafka connect pods

      # Connect stores its own state in these Kafka topics (created automatically)
      # rather than each task storing state in itself, kafka connect stores the state in kafka only
      CONFIG_STORAGE_TOPIC: my-connect-configs   # connector configs
      OFFSET_STORAGE_TOPIC: my-connect-offsets   # how far each connector has read (e.g. binlog position)
      STATUS_STORAGE_TOPIC: my-connect-status    # connector/task status

      # single broker -> replication factor 1
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    networks:
      - kcd
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
# connect with the already connected network
  kcd:
  # true - assume the network already exists and connect to it
    external: true
    name: "kafka_connect_demo" # created by docker-compose.yml (project "kafka-connect-demo")
